services:
  frontend:
    build: ./services/frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - public_net

  backend:
    build: ./services/backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-labdb}
      POSTGRES_USER: ${POSTGRES_USER:-labuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - public_net
      - internal_net

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labdb}
      POSTGRES_USER: ${POSTGRES_USER:-labuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal_net

networks:
  public_net:
    name: public_net
    driver: bridge
  internal_net:
    name: internal_net
    driver: bridge
    internal: true
